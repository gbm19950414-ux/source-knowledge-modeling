[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-knowledge-modeling"
version = "0.9.9"
description = "Source-faithful, domain-independent document and knowledge modeling"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "reportlab>=4,<5"]

[project.scripts]
skm = "source_knowledge_modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
source_knowledge_modeling = ["schemas/*.json", "profiles/*.json", "profiles/*.md", "templates/*.html", "templates/*.md", "resources/*.json", "resources/humanizer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
